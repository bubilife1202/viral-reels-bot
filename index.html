<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이럴 릴스 분석 대시보드</title>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8245597797545485"
     crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
        }

        .header {
            background: #121212;
            border-bottom: 1px solid #1f1f1f;
            padding: 2rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
        }

        .filters {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #e0e0e0;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: #2a2a2a;
            border-color: #3a3a3a;
        }

        .filter-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }

        #content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        .date-section {
            margin-bottom: 3rem;
        }

        .date-badge {
            display: inline-block;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .reel-card {
            background: #121212;
            border: 1px solid #1f1f1f;
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s;
        }

        .reel-card:hover {
            border-color: #2a2a2a;
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .badges {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-success {
            background: #10b981;
            color: #000;
        }

        .badge-warning {
            background: #f59e0b;
            color: #000;
        }

        .badge-danger {
            background: #ef4444;
            color: #fff;
        }

        .badge-score {
            background: #6366f1;
            color: #fff;
        }

        .category-icon {
            font-size: 1.5rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .card-section {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #1f1f1f;
        }

        .card-section:last-of-type {
            border-bottom: none;
        }

        .card-section h4 {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .card-section p {
            font-size: 0.9rem;
            color: #d0d0d0;
            line-height: 1.5;
        }

        .script-section {
            background: #0a0a0a;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #1f1f1f;
        }

        .script-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .copy-btn {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #e0e0e0;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #2a2a2a;
        }

        .script-content {
            background: transparent;
            border: none;
            color: #b0b0b0;
            font-size: 0.85rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'SF Mono', Monaco, monospace;
        }

        .card-footer {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .btn {
            flex: 1;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s;
            display: inline-block;
        }

        .btn-primary {
            background: #2563eb;
            color: #fff;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background: #2a2a2a;
        }

        footer {
            background: #121212;
            border-top: 1px solid #1f1f1f;
            padding: 2rem;
            text-align: center;
            color: #666;
            font-size: 0.85rem;
        }

        footer a {
            color: #888;
            text-decoration: none;
            margin: 0 1rem;
        }

        footer a:hover {
            color: #e0e0e0;
        }

        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }

            .filters {
                padding: 0 1rem;
            }

            #content {
                padding: 0 1rem 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>🎬 바이럴 릴스 분석 대시보드</h1>
            <p class="subtitle">실전 활용 가능한 릴스 아이디어 · 매일 오전 8시 업데이트</p>
        </div>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="filterCards('all')">전체</button>
        <button class="filter-btn" onclick="filterCards('Faceless')">🎭 얼굴 노출 X</button>
        <button class="filter-btn" onclick="filterCards('Skit')">🎬 상황극</button>
        <button class="filter-btn" onclick="filterCards('Trend')">🔥 챌린지</button>
        <button class="filter-btn" onclick="filterCards('Info')">💡 정보성</button>
        <button class="filter-btn" onclick="filterCards('Easy')">초보자 추천</button>
    </div>

    <div id="content">
        <!-- CONTENT_START -->

        <!-- 여기에 새로운 콘텐츠가 추가됩니다 -->

    </div>

    <footer>
        <div>
            <a href="https://www.instagram.com/reels_code_official" target="_blank">📷 Instagram</a>
            <a href="https://www.threads.com/@reels_code_official" target="_blank">🧵 Threads</a>
        </div>
        <p style="margin-top: 1rem;">자동 업데이트: 매일 오전 8시 (KST)</p>
    </footer>

    <script>
        // 필터링 기능
        function filterCards(filter) {
            const cards = document.querySelectorAll('.reel-card');
            const buttons = document.querySelectorAll('.filter-btn');

            // 버튼 활성화 상태 변경
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // 카드 필터링
            cards.forEach(card => {
                if (filter === 'all') {
                    card.style.display = 'block';
                } else if (filter === 'Easy') {
                    card.style.display = card.dataset.difficulty === 'Easy' ? 'block' : 'none';
                } else {
                    card.style.display = card.dataset.category === filter ? 'block' : 'none';
                }
            });
        }

        // 스크립트 복사 기능
        function copyScript(text) {
            navigator.clipboard.writeText(text).then(() => {
                event.target.textContent = '✅ 복사됨';
                setTimeout(() => {
                    event.target.textContent = '📋 복사';
                }, 2000);
            }).catch(err => {
                console.error('복사 실패:', err);
                alert('복사에 실패했습니다.');
            });
        }
    </script>
</body>
</html>
