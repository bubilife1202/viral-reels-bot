<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 바이럴 릴스 아이디어 대시보드</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .header {
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 2rem 0;
            margin-bottom: 3rem;
        }

        .header h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
        }

        .card {
            border: none;
            border-radius: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .card-title {
            color: #667eea;
            font-weight: bold;
        }

        .date-section h2 .badge {
            font-size: 1.2rem;
            padding: 0.6rem 1.5rem;
        }

        .text-muted {
            color: #6c757d !important;
            font-weight: 600;
        }

        .btn {
            border-radius: 20px;
        }

        hr {
            border: 2px solid rgba(255,255,255,0.3);
        }

        footer {
            text-align: center;
            color: white;
            padding: 2rem 0;
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1 class="text-center">🔥 바이럴 릴스 아이디어 대시보드</h1>
            <p class="text-center text-muted">매일 아침 업데이트되는 인스타 릴스 콘텐츠 아이디어</p>
        </div>
    </div>

    <div class="container my-5">
        <!-- CONTENT_START -->

        <!-- 여기에 새로운 콘텐츠가 추가됩니다 -->

    </div>

    <footer>
        <p>🤖 Powered by Reddit API + Groq AI (Llama 3)</p>
        <p>자동 업데이트: 매일 오전 8시 (KST)</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
