<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Reels Lab - 바이럴 영상 트렌드 분석</title>
    <meta name="description" content="TikTok, Instagram Reels 바이럴 영상 트렌드를 AI로 분석하여 한국형 콘텐츠 아이디어를 제공합니다.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8245597797545485"
     crossorigin="anonymous"></script>
    <!-- 전면광고(Vignette) 활성화 -->
    <meta name="google-adsense-platform-account" content="ca-pub-8245597797545485">
    <script>
    (adsbygoogle = window.adsbygoogle || []).push({
        google_ad_client: "ca-pub-8245597797545485",
        enable_page_level_ads: true,
        overlays: {bottom: true}
    });
    </script>

    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-card: #111111;
            --bg-hover: #1a1a1a;
            --border-color: #222222;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-tiktok: #ff0050;
            --accent-instagram: #e1306c;
            --gradient-hero: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            --gradient-tiktok: linear-gradient(135deg, #00f2ea, #ff0050);
            --gradient-instagram: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            position: relative;
            padding: 4rem 2rem 3rem;
            text-align: center;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at top, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at bottom right, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 100px;
            font-size: 0.85rem;
            color: var(--accent-purple);
            margin-bottom: 1.5rem;
        }

        .hero-badge .pulse {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            background: var(--gradient-hero);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Platform Filter */
        .filter-section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .platform-tabs {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .platform-tab {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .platform-tab:hover {
            background: var(--bg-hover);
            border-color: #333;
            transform: translateY(-2px);
        }

        .platform-tab.active {
            border-color: var(--accent-purple);
            background: rgba(139, 92, 246, 0.1);
            color: var(--text-primary);
        }

        .platform-tab.tiktok.active {
            border-color: var(--accent-tiktok);
            background: rgba(255, 0, 80, 0.1);
        }

        .platform-tab.instagram.active {
            border-color: var(--accent-instagram);
            background: rgba(225, 48, 108, 0.1);
        }

        .platform-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .platform-icon.all {
            background: var(--gradient-hero);
        }

        .platform-icon.tiktok {
            background: #000;
            border: 1px solid var(--accent-tiktok);
        }

        .platform-icon.instagram {
            background: var(--gradient-instagram);
        }

        /* Main Content */
        #content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        .date-section {
            margin-bottom: 3rem;
        }

        .date-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .date-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .date-badge::before {
            content: '📅';
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.5rem;
        }

        /* Card Styles */
        .reel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .reel-card:hover {
            border-color: #333;
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card-media {
            position: relative;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }

        .card-media::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
        }

        .play-button {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .card-media:hover .play-button {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .platform-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            z-index: 2;
        }

        .platform-badge.tiktok {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--accent-tiktok);
            color: #fff;
        }

        .platform-badge.instagram {
            background: var(--gradient-instagram);
            color: #fff;
        }

        .platform-badge.general {
            background: rgba(59, 130, 246, 0.8);
            color: #fff;
        }

        .score-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.5rem 0.75rem;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 2;
        }

        .score-badge .score {
            color: #fbbf24;
        }

        .card-body {
            padding: 1.5rem;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .info-item {
            display: flex;
            gap: 0.75rem;
        }

        .info-icon {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .info-content {
            flex: 1;
        }

        .info-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .info-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .script-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .script-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .script-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .copy-btn {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.75rem;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #222;
            color: var(--text-primary);
        }

        .script-content {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
            white-space: pre-wrap;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            max-height: 150px;
            overflow-y: auto;
        }

        .card-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.25rem;
        }

        .action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        .action-btn.primary {
            background: var(--accent-blue);
            color: #fff;
            border: none;
        }

        .action-btn.primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .action-btn.secondary {
            background: var(--bg-hover);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .action-btn.secondary:hover {
            background: #222;
            color: var(--text-primary);
        }

        /* Footer */
        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 3rem 2rem;
            text-align: center;
        }

        .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--text-primary);
        }

        .footer-info {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .visitor-count {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero {
                padding: 3rem 1.5rem 2rem;
            }

            .stats {
                gap: 2rem;
            }

            .filter-section {
                padding: 1.5rem 1rem;
            }

            .platform-tabs {
                gap: 0.75rem;
            }

            .platform-tab {
                padding: 0.875rem 1.25rem;
                font-size: 0.9rem;
            }

            .platform-tab span:last-child {
                display: none;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            #content {
                padding: 0 1rem 3rem;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        /* Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reel-card {
            animation: fadeInUp 0.5s ease forwards;
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <div class="hero-badge">
                <span class="pulse"></span>
                매일 오전 8시 자동 업데이트
            </div>
            <h1>Viral Reels Lab</h1>
            <p>TikTok과 Instagram의 글로벌 바이럴 영상을 AI가 분석하여<br>한국형 숏폼 콘텐츠 아이디어를 제공합니다</p>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="totalVideos">12+</div>
                    <div class="stat-label">일일 분석 영상</div>
                </div>
                <div class="stat">
                    <div class="stat-value">5</div>
                    <div class="stat-label">데이터 소스</div>
                </div>
                <div class="stat">
                    <div class="stat-value">AI</div>
                    <div class="stat-label">Gemini 2.5 Flash</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Platform Filter -->
    <section class="filter-section">
        <div class="platform-tabs">
            <button class="platform-tab active" onclick="filterByPlatform('all')">
                <span class="platform-icon all">🌐</span>
                <span>전체</span>
            </button>
            <button class="platform-tab tiktok" onclick="filterByPlatform('TikTok')">
                <span class="platform-icon tiktok">📱</span>
                <span>TikTok</span>
            </button>
            <button class="platform-tab instagram" onclick="filterByPlatform('Instagram')">
                <span class="platform-icon instagram">📷</span>
                <span>Instagram</span>
            </button>
        </div>
    </section>

    <!-- Main Content -->
    <div id="content">
        <!-- CONTENT_START -->
        <!-- 여기에 새로운 콘텐츠가 추가됩니다 -->

    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="https://www.instagram.com/reels_code_official" target="_blank">
                    📷 Instagram
                </a>
                <a href="https://www.threads.com/@reels_code_official" target="_blank">
                    🧵 Threads
                </a>
            </div>
            <p class="visitor-count">
                Total Visitors: <span id="visitorCount">-</span>
            </p>
        </div>
    </footer>

    <script>
        // 방문자 카운터
        async function trackVisitor() {
            try {
                if (!sessionStorage.getItem('visited')) {
                    await fetch('/api/visitor', { method: 'POST' });
                    sessionStorage.setItem('visited', 'true');
                }
                const response = await fetch('/api/visitor');
                const data = await response.json();
                document.getElementById('visitorCount').textContent = data.total?.toLocaleString() || '-';
            } catch (error) {
                console.log('Visitor tracking unavailable');
            }
        }
        trackVisitor();

        // 플랫폼 필터
        function filterByPlatform(platform) {
            const cards = document.querySelectorAll('.reel-card');
            const tabs = document.querySelectorAll('.platform-tab');

            // 탭 활성화 상태 변경
            tabs.forEach(tab => tab.classList.remove('active'));
            event.target.closest('.platform-tab').classList.add('active');

            // 카드 필터링
            cards.forEach(card => {
                if (platform === 'all') {
                    card.style.display = 'block';
                } else {
                    const cardPlatform = card.dataset.platform || 'General';
                    card.style.display = cardPlatform === platform ? 'block' : 'none';
                }
            });
        }

        // 스크립트 복사
        function copyScript(text) {
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target.closest('.copy-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ 복사됨';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            }).catch(err => {
                console.error('복사 실패:', err);
            });
        }
    </script>
</body>
</html>
